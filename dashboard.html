<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eksekutif Dashboard - IKP-R</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background-color: #f4f6f9; }
    .kpi-card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: white; }
    .kpi-card h3 { font-size: 2.5rem; font-weight: 700; margin: 0; }
    .kpi-card p { font-size: 1.1rem; margin: 0; opacity: 0.9; }
    .chart-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="#">📊 Eksekutif Dashboard IKP-R</a>
    <button class="btn btn-outline-light btn-sm" onclick="fetchData()">🔄 Segarkan Data</button>
  </div>
</nav>

<div class="container-fluid px-4">
  <div id="loadingIndicator" class="text-center py-5">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 text-muted">Mengambil data dari server...</h5>
  </div>

  <div id="dashboardContent" style="display: none;">
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card kpi-card bg-primary p-3">
          <p>Total Asesmen</p>
          <h3 id="kpiTotal">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card kpi-card bg-success p-3">
          <p>Total LAYAK</p>
          <h3 id="kpiLayak">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card kpi-card bg-warning text-dark p-3">
          <p>LAYAK BERSYARAT</p>
          <h3 id="kpiSyarat">0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card kpi-card bg-danger p-3">
          <p>TIDAK LAYAK</p>
          <h3 id="kpiTidakLayak">0</h3>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="chart-container">
          <h5 class="text-center mb-3 fw-bold text-secondary">Kategori Kelayakan Asesmen</h5>
          <canvas id="chartKategori" height="250"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="chart-container">
          <h5 class="text-center mb-3 fw-bold text-secondary">Rekomendasi Klaster Pekerjaan</h5>
          <canvas id="chartKlaster" height="250"></canvas>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-12">
        <div class="chart-container">
          <h5 class="text-center mb-3 fw-bold text-secondary">Status Keputusan Sidang TPP UPT</h5>
          <canvas id="chartTPP" height="100"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // PENTING: Gunakan URL Web App yang sama
  const API_URL = "https://script.google.com/macros/s/AKfycbzo3IGnkOBHLLDtP_FD4rnnXC81rq6S0OuC_vI0FQ-mQXa0TLwLIRqC-1Ix86NbgGtN/exec"; 

  let chartKategoriInstance = null;
  let chartKlasterInstance = null;
  let chartTPPInstance = null;

  window.onload = function() { fetchData(); };

  function fetchData() {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('dashboardContent').style.display = 'none';

    fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "read" }) })
    .then(r => r.json())
    .then(r => {
      if(r.success && r.data.length > 0) {
        processDashboardData(r.data);
      } else {
        alert("Belum ada data atau gagal mengambil data.");
        document.getElementById('loadingIndicator').style.display = 'none';
      }
    }).catch(e => {
      alert("Terjadi kesalahan koneksi: " + e);
      document.getElementById('loadingIndicator').style.display = 'none';
    });
  }

  function processDashboardData(data) {
    let total = data.length;
    let katLayak = 0, katSyarat = 0, katTidak = 0, katTunda = 0;
    let klsTani = 0, klsIkan = 0, klsNonLahan = 0, klsKosong = 0;
    let tppSetuju = 0, tppTolak = 0, tppTunda = 0;

    data.forEach(row => {
      // PERBAIKAN INDEKS: Kolom CZ (Kategori Hasil) = 103
      let kategori = String(row[103] || "").toUpperCase().trim();
      if(kategori === "LAYAK") katLayak++;
      else if(kategori.includes("BERSYARAT")) katSyarat++;
      else if(kategori === "TIDAK LAYAK") katTidak++;
      else katTunda++;

      // PERBAIKAN INDEKS: Kolom DA (Rekomendasi Klaster) = 104
      let klaster = String(row[104] || "").toUpperCase().trim();
      if(klaster.includes("PERTANIAN")) klsTani++;
      else if(klaster.includes("PERIKANAN")) klsIkan++;
      else if(klaster.includes("NON-LAHAN") || klaster.includes("NON LAHAN")) klsNonLahan++;
      else klsKosong++;

      // PERBAIKAN INDEKS: Kolom DB (Keputusan TPP UPT) = 105
      let tpp = String(row[105] || "").toUpperCase().trim();
      if(tpp === "DISETUJUI") tppSetuju++;
      else if(tpp === "TIDAK DISETUJUI") tppTolak++;
      else tppTunda++;
    });

    document.getElementById('kpiTotal').innerText = total;
    document.getElementById('kpiLayak').innerText = katLayak;
    document.getElementById('kpiSyarat').innerText = katSyarat;
    document.getElementById('kpiTidakLayak').innerText = katTidak;

    if(chartKategoriInstance) chartKategoriInstance.destroy();
    chartKategoriInstance = new Chart(document.getElementById('chartKategori').getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: ['Layak', 'Layak Bersyarat', 'Tidak Layak', 'Ditunda'],
        datasets: [{
          data: [katLayak, katSyarat, katTidak, katTunda],
          backgroundColor: ['#198754', '#ffc107', '#dc3545', '#6c757d']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    if(chartKlasterInstance) chartKlasterInstance.destroy();
    chartKlasterInstance = new Chart(document.getElementById('chartKlaster').getContext('2d'), {
      type: 'bar',
      data: {
        labels: ['Pertanian (Kementan)', 'Perikanan (KKP)', 'Re-Edukasi Non-Lahan'],
        datasets: [{
          label: 'Jumlah Narapidana',
          data: [klsTani, klsIkan, klsNonLahan],
          backgroundColor: ['#20c997', '#0dcaf0', '#fd7e14']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });

    if(chartTPPInstance) chartTPPInstance.destroy();
    chartTPPInstance = new Chart(document.getElementById('chartTPP').getContext('2d'), {
      type: 'bar',
      data: {
        labels: ['Disetujui', 'Tidak Disetujui', 'Ditunda'],
        datasets: [{
          label: 'Hasil Sidang TPP',
          data: [tppSetuju, tppTolak, tppTunda],
          backgroundColor: ['#0d6efd', '#dc3545', '#adb5bd']
        }]
      },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });

    document.getElementById('loadingIndicator').style.display = 'none';
    document.getElementById('dashboardContent').style.display = 'block';
  }
</script>
</body>
</html>
